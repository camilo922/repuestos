<?xml version="1.0" encoding="utf-8"?>
<!-- Rombo (lozenge) de Renault simplificado a un path vectorial limpio en negro,
     sin imagenes incrustadas ni fondos blancos, para que se vea bien sobre
     cualquier fondo (banda naranja de marcas). -->
<svg width="800px" height="800px" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" fill="#000000" d="M50 4 L96 50 L50 96 L4 50 Z M50 21 L79 50 L50 79 L21 50 Z"/></svg>
